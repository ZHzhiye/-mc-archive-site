<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员验证 - MC Admin</title>
<link rel="stylesheet" href="admin/style.css">
</head>
<body class="login-body">
<div class="login-box">
  <div class="login-brand"><div class="lg">🛡️ MC Archive</div><div class="tag">Minecraft 存档与 Mod 资料管理平台</div></div>
  <div class="login-card">
    <h1>🔐 管理员验证</h1>
    <p class="login-desc">请上传管理员密钥文件以进入后台</p>
    <div class="drop" id="drop">
      <div class="ic">📎</div><p>拖拽密钥文件到此处，或点击选择</p>
      <small>需要 <code>admin.key</code> 文件</small>
    </div>
    <input type="file" id="kf" accept=".key" hidden>
    <div class="finfo" id="fi" style="display:none;">
      <span class="fn"></span><span class="fs"></span>
    </div>
    <button class="btn btn-block" id="vb" disabled>验证并进入</button>
    <div class="hint"><p>🔑 密钥文件说明</p><ul>
      <li>· 文件名必须为 <code>admin.key</code></li>
      <li>· 文件内容需包含管理员令牌</li>
      <li>· 请联系站长获取密钥文件</li>
    </ul></div>
    <div class="lfoot"><a href="index.html">← 返回用户端</a></div>
  </div>
</div>
<script>
var VF='admin.key', VP='MC-ADMIN-';
var drop=document.getElementById('drop'),kf=document.getElementById('kf'),
    fi=document.getElementById('fi'),fn=fi.querySelector('.fn'),fs=fi.querySelector('.fs'),vb=document.getElementById('vb');
var uf=null;
drop.addEventListener('click',function(){kf.click();});
drop.addEventListener('dragover',function(e){e.preventDefault();drop.classList.add('drag');});
drop.addEventListener('dragleave',function(){drop.classList.remove('drag');});
drop.addEventListener('drop',function(e){e.preventDefault();drop.classList.remove('drag');if(e.dataTransfer.files.length)hf(e.dataTransfer.files[0]);});
kf.addEventListener('change',function(e){if(e.target.files.length)hf(e.target.files[0]);});
function hf(file){
  uf=file;fn.textContent=file.name;
  if(file.name===VF){fs.textContent='✅ 文件名正确';fs.className='fs ok';vb.disabled=false;}
  else{fs.textContent='❌ 需要 admin.key';fs.className='fs err';vb.disabled=true;}
  fi.style.display='flex';drop.style.display='none';
}
vb.addEventListener('click',function(){
  if(!uf)return;
  var r=new FileReader();
  r.onload=function(e){
    if(e.target.result.trim().indexOf(VP)===0){
      localStorage.setItem('mc_admin_auth','true');
      localStorage.setItem('mc_admin_user','admin');
      localStorage.setItem('mc_admin_login_time',Date.now().toString());
      location.href='admin/index.html';
    }else{alert('密钥文件内容无效！\n空壳阶段：文件内容需以 "MC-ADMIN-" 开头');}
  };
  r.readAsText(uf);
});
if(localStorage.getItem('mc_admin_auth')==='true'){location.href='admin/index.html';}
</script>
</body>
</html>
