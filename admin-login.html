<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员验证 - MC Archive</title>
    <link rel="stylesheet" href="admin/style.css">
</head>
<body class="admin-login-body">
    <div class="admin-login-container">
        <div class="admin-login-brand">
            <div class="brand-logo">🛡️ MC Archive</div>
            <div class="brand-tag">Minecraft 存档与 Mod 资料管理平台</div>
        </div>

        <div class="admin-login-card">
            <h1>🔐 管理员验证</h1>
            <p class="login-desc">请上传管理员密钥文件以进入后台</p>

            <div class="file-drop-zone" id="dropZone">
                <span class="drop-icon">📎</span>
                <p>拖拽密钥文件到此处，或点击选择</p>
                <small>需要 <code>admin.key</code> 文件</small>
            </div>
            <input type="file" id="keyFile" accept=".key" hidden>

            <div class="file-info" id="fileInfo" style="display:none;">
                <span class="file-name"></span>
                <span class="file-status"></span>
            </div>

            <button class="admin-btn admin-btn-primary admin-btn-block" id="verifyBtn" disabled>
                验证并进入
            </button>

            <div class="admin-login-hint">
                <p>🔑 密钥文件说明</p>
                <ul>
                    <li>· 文件名必须为 <code>admin.key</code></li>
                    <li>· 文件内容需包含管理员令牌</li>
                    <li>· 请联系站长获取密钥文件</li>
                </ul>
            </div>

            <div class="admin-login-footer">
                <a href="index.html">← 返回用户端</a>
            </div>
        </div>
    </div>

    <script>
    var VALID_FILENAME = 'admin.key';
    var VALID_CONTENT_PREFIX = 'MC-ADMIN-';

    var dropZone = document.getElementById('dropZone');
    var fileInput = document.getElementById('keyFile');
    var fileInfo = document.getElementById('fileInfo');
    var verifyBtn = document.getElementById('verifyBtn');
    var fileNameSpan = fileInfo.querySelector('.file-name');
    var fileStatusSpan = fileInfo.querySelector('.file-status');
    var uploadedFile = null;

    dropZone.addEventListener('click', function() { fileInput.click(); });
    dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('drag-over'); });
    dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', function(e) {
        if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
        uploadedFile = file;
        fileNameSpan.textContent = file.name;
        if (file.name === VALID_FILENAME) {
            fileStatusSpan.textContent = '✅ 文件名正确';
            fileStatusSpan.className = 'file-status ok';
            verifyBtn.disabled = false;
        } else {
            fileStatusSpan.textContent = '❌ 需要 admin.key';
            fileStatusSpan.className = 'file-status error';
            verifyBtn.disabled = true;
        }
        fileInfo.style.display = 'flex';
        dropZone.style.display = 'none';
    }

    verifyBtn.addEventListener('click', function() {
        if (!uploadedFile) return;
        var reader = new FileReader();
        reader.onload = function(e) {
            var content = e.target.result;
            if (content.trim().indexOf(VALID_CONTENT_PREFIX) === 0) {
                localStorage.setItem('mc_admin_auth', 'true');
                localStorage.setItem('mc_admin_user', 'admin');
                localStorage.setItem('mc_admin_login_time', Date.now().toString());
                window.location.href = 'admin/index.html';
            } else {
                alert('密钥文件内容无效！\n空壳阶段：文件内容需以 "MC-ADMIN-" 开头');
            }
        };
        reader.readAsText(uploadedFile);
    });

    if (localStorage.getItem('mc_admin_auth') === 'true') {
        window.location.href = 'admin/index.html';
    }
    </script>
</body>
</html>
