<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审核队列 - MC Archive Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar-logo">
                <div class="logo-icon">🛡️ MC Admin <small>v0.1</small></div>
                <div class="logo-sub">资料管理平台</div>
            </div>
            <nav class="admin-nav">
                <div class="admin-nav-section">核心功能</div>
                <a href="index.html" class="admin-nav-item"><span class="nav-icon">📊</span>仪表盘</a>
                <a href="worlds.html" class="admin-nav-item"><span class="nav-icon">🌍</span>存档管理</a>
                <a href="mods.html" class="admin-nav-item"><span class="nav-icon">🔧</span>Mod 管理</a>
                <a href="users.html" class="admin-nav-item"><span class="nav-icon">👥</span>用户管理</a>
                <a href="reviews.html" class="admin-nav-item active"><span class="nav-icon">📋</span>审核队列</a>
                <a href="settings.html" class="admin-nav-item"><span class="nav-icon">⚙️</span>设置</a>
            </nav>
            <div class="admin-sidebar-footer">
                <div class="admin-user-chip">
                    <div class="avatar" id="adminAvatar">A</div>
                    <span class="uname" id="adminUser"></span>
                </div>
                <button class="admin-btn-logout" onclick="logout()">退出</button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="admin-header-left">
                    <h1>审核队列</h1>
                    <div class="breadcrumb">内容 / 审核队列</div>
                </div>
                <div class="admin-header-right">
                    <span class="admin-badge">空壳演示 v0.1</span>
                    <button class="admin-header-btn" title="刷新" onclick="location.reload()">🔄</button>
                    <button class="admin-header-btn" title="返回前台" onclick="location.href='../index.html'">🏠</button>
                </div>
            </header>
            <div class="admin-page-padding">

                <div class="admin-panel">
                    <div class="admin-panel-header">
                        <h3>📋 待审核内容</h3>
                        <span class="admin-panel-hint">空壳 · 暂无待审</span>
                    </div>
                    <div class="admin-panel-body">
                        <div class="admin-empty">
                            <div class="empty-icon">✅</div>
                            <p>当前没有待审核内容</p>
                            <p class="empty-sub">用户上传后会进入此队列，管理员通过或打回</p>
                        </div>
                    </div>
                </div>

                <div class="admin-panel" style="margin-top:1.5rem;">
                    <div class="admin-panel-header">
                        <h3>🕐 最近审核记录</h3>
                    </div>
                    <div class="admin-empty">
                        <div class="empty-icon">📭</div>
                        <p>暂无审核记录</p>
                    </div>
                </div>

            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
