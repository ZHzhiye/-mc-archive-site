<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>仪表盘 - MC Admin</title><link rel="stylesheet" href="style.css"></head>
<body>
<aside class="sidebar">
  <div class="side-logo"><b>🛡️ MC Admin</b><small>资料管理平台</small></div>
  <nav class="side-nav"><a href="index.html" class active>📊 仪表盘</a>
  <a href="worlds.html" class>🌍 存档管理</a>
  <a href="mods.html" class>🔧 Mod管理</a>
  <a href="users.html" class>👥 用户管理</a>
  <a href="reviews.html" class>📋 审核队列</a>
  <a href="settings.html" class>⚙️ 设置</a></nav>
  <div class="side-foot"><span id="au">@admin</span><button class="btn-out" onclick="logout()">退出</button></div>
</aside>
<main class="main">
  <header class="mhead"><h1>仪表盘</h1><span class="badge">空壳 v0.1</span></header>
  <div class="content">
<div class="stats">
  <div class="scard"><div class="sic">🌍</div><div><div class="snum">0</div><div class="slabel">存档总数</div></div></div>
  <div class="scard"><div class="sic">🔧</div><div><div class="snum">0</div><div class="slabel">Mod 总数</div></div></div>
  <div class="scard"><div class="sic">👥</div><div><div class="snum">1</div><div class="slabel">注册用户</div></div></div>
  <div class="scard"><div class="sic">⏳</div><div><div class="snum">0</div><div class="slabel">待审核</div></div></div>
</div>
<div class="two-col">
  <div class="card"><h3>📥 最近上传</h3><div class="empty"><div class="ic">📭</div><p>暂无上传记录</p></div></div>
  <div class="card"><h3>⚙️ 系统状态</h3>
    <div class="sitem"><span>前端界面</span><b class="ok">✓ 正常</b></div>
    <div class="sitem"><span>后端 API</span><b class="pend">⏳ 未接入</b></div>
    <div class="sitem"><span>文件存储</span><b class="pend">⏳ 未配置</b></div>
    <div class="sitem"><span>数据库</span><b class="pend">⏳ 未配置</b></div>
  </div>
</div>
<div class="card"><h3>📋 快速操作</h3><p>管理存档 · 管理 Mod · 用户管理 · 审核队列 · 系统设置</p></div>
</div>
</main>
<script src="script.js"></script></body></html>
