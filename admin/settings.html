<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置 - MC Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="admin-nav">
  <div class="admin-nav-inner">
    <div class="an-left">
      <span class="an-logo">🛡️ MC Admin</span>
      <span class="an-ver">空壳 v0.1</span>
    </div>
    <div class="an-links">
      <a href="index.html">📊 仪表盘</a>
<a href="worlds.html">🌍 存档管理</a>
<a href="mods.html">🔧 Mod管理</a>
<a href="users.html">👥 用户管理</a>
<a href="reviews.html">📋 审核队列</a>
<a href="settings.html" class='active'>⚙️ 设置</a>
      <a href="../index.html">🏠 前台</a>
      <a href="javascript:logout()" class="logout">退出</a>
    </div>
  </div>
</nav>
<div class="admin-wrap">
  <div class="breadcrumb" style="padding-top:1.5rem;color:#6b7c8f;font-size:.85rem;">系统 / 设置</div>

<div class="panel">
  <div class="panel-head"><h3>🏷️ 基本信息</h3></div>
  <div class="panel-body">
    <div class="sgroup"><label>站点名称</label><input type="text" value="MC Archive"></div>
    <div class="sgroup"><label>站点描述</label><input type="text" value="Minecraft 存档与 Mod 分享平台"></div>
    <div class="sgroup"><label>站点关键词（逗号分隔）</label><input type="text" value="Minecraft, 存档, Mod, 资料, 分享"></div>
    <button class="btn">保存设置</button>
    <p style="color:#a0a0a0;font-size:.8rem;margin-top:.8rem;">⚠️ 空壳阶段：设置不会实际生效，仅做界面展示</p>
  </div>
</div>
<div class="panel">
  <div class="panel-head"><h3>📤 上传配置</h3></div>
  <div class="panel-body">
    <div class="sgroup"><label>允许的文件类型</label><input type="text" value=".zip, .mcworld, .jar"></div>
    <div class="sgroup"><label>单个文件最大大小 (MB)</label><input type="number" value="500"></div>
    <div class="sgroup"><label>每日上传上限（次/用户）</label><input type="number" value="10"></div>
    <button class="btn">保存配置</button>
  </div>
</div>
<div class="panel danger">
  <div class="panel-head"><h3>⚠️ 危险区域</h3></div>
  <div class="panel-body">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;">
      <div><b>清空所有数据</b><p style="color:#a0a0a0;font-size:.82rem;margin-top:4px;">此操作将删除所有存档、Mod 和用户信息，不可恢复</p></div>
      <button class="btn" style="background:#e74c3c;">清空数据</button>
    </div>
  </div>
</div>

</div>
<script src="script.js"></script>
</body>
</html>
