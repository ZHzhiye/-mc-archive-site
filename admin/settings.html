<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - MC Archive Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar-logo">
                <div class="logo-icon">🛡️ MC Admin <small>v0.1</small></div>
                <div class="logo-sub">资料管理平台</div>
            </div>
            <nav class="admin-nav">
                <div class="admin-nav-section">核心功能</div>
                <a href="index.html" class="admin-nav-item"><span class="nav-icon">📊</span>仪表盘</a>
                <a href="worlds.html" class="admin-nav-item"><span class="nav-icon">🌍</span>存档管理</a>
                <a href="mods.html" class="admin-nav-item"><span class="nav-icon">🔧</span>Mod 管理</a>
                <a href="users.html" class="admin-nav-item"><span class="nav-icon">👥</span>用户管理</a>
                <a href="reviews.html" class="admin-nav-item"><span class="nav-icon">📋</span>审核队列</a>
                <a href="settings.html" class="admin-nav-item active"><span class="nav-icon">⚙️</span>设置</a>
            </nav>
            <div class="admin-sidebar-footer">
                <div class="admin-user-chip">
                    <div class="avatar" id="adminAvatar">A</div>
                    <span class="uname" id="adminUser"></span>
                </div>
                <button class="admin-btn-logout" onclick="logout()">退出</button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="admin-header-left">
                    <h1>设置</h1>
                    <div class="breadcrumb">系统 / 设置</div>
                </div>
                <div class="admin-header-right">
                    <span class="admin-badge">空壳演示 v0.1</span>
                    <button class="admin-header-btn" title="刷新" onclick="location.reload()">🔄</button>
                    <button class="admin-header-btn" title="返回前台" onclick="location.href='../index.html'">🏠</button>
                </div>
            </header>
            <div class="admin-page-padding">

                <div class="admin-panel">
                    <div class="admin-panel-header">
                        <h3>🏷️ 基本信息</h3>
                    </div>
                    <div class="admin-panel-body">
                        <div class="setting-group">
                            <label>站点名称</label>
                            <input type="text" value="MC Archive">
                        </div>
                        <div class="setting-group">
                            <label>站点描述</label>
                            <input type="text" value="Minecraft 存档与 Mod 分享平台">
                        </div>
                        <div class="setting-group">
                            <label>站点关键词（用逗号分隔）</label>
                            <input type="text" value="Minecraft, 存档, Mod, 资料, 分享">
                        </div>
                        <button class="admin-btn admin-btn-primary">保存设置</button>
                        <p style="color:#a0adc0; font-size:0.8rem; margin-top:0.8rem;">⚠️ 空壳阶段：设置不会实际生效，仅做界面展示</p>
                    </div>
                </div>

                <div class="admin-panel" style="margin-top:1.5rem;">
                    <div class="admin-panel-header">
                        <h3>📤 上传配置</h3>
                    </div>
                    <div class="admin-panel-body">
                        <div class="setting-group">
                            <label>允许的文件类型</label>
                            <input type="text" value=".zip, .mcworld, .jar">
                        </div>
                        <div class="setting-group">
                            <label>单个文件最大大小 (MB)</label>
                            <input type="number" value="500">
                        </div>
                        <div class="setting-group">
                            <label>每日上传上限（次/用户）</label>
                            <input type="number" value="10">
                        </div>
                        <button class="admin-btn admin-btn-primary">保存配置</button>
                    </div>
                </div>

                <div class="admin-panel" style="margin-top:1.5rem; border-color:#f5c6c0;">
                    <div class="admin-panel-header" style="border-color:#f5c6c0;">
                        <h3 style="color:#e74c3c;">⚠️ 危险区域</h3>
                    </div>
                    <div class="admin-panel-body">
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
                            <div>
                                <strong>清空所有数据</strong>
                                <p style="color:#a0adc0; font-size:0.82rem; margin-top:4px;">此操作将删除所有存档、Mod 和用户信息，不可恢复</p>
                            </div>
                            <button class="admin-btn" style="background:#e74c3c; color:#fff;">清空数据</button>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
