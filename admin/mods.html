<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mod 管理 - MC Archive Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar-logo">
                <div class="logo-icon">🛡️ MC Admin <small>v0.1</small></div>
                <div class="logo-sub">资料管理平台</div>
            </div>
            <nav class="admin-nav">
                <div class="admin-nav-section">核心功能</div>
                <a href="index.html" class="admin-nav-item"><span class="nav-icon">📊</span>仪表盘</a>
                <a href="worlds.html" class="admin-nav-item"><span class="nav-icon">🌍</span>存档管理</a>
                <a href="mods.html" class="admin-nav-item active"><span class="nav-icon">🔧</span>Mod 管理</a>
                <a href="users.html" class="admin-nav-item"><span class="nav-icon">👥</span>用户管理</a>
                <a href="reviews.html" class="admin-nav-item"><span class="nav-icon">📋</span>审核队列</a>
                <a href="settings.html" class="admin-nav-item"><span class="nav-icon">⚙️</span>设置</a>
            </nav>
            <div class="admin-sidebar-footer">
                <div class="admin-user-chip">
                    <div class="avatar" id="adminAvatar">A</div>
                    <span class="uname" id="adminUser"></span>
                </div>
                <button class="admin-btn-logout" onclick="logout()">退出</button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="admin-header-left">
                    <h1>Mod 管理</h1>
                    <div class="breadcrumb">内容 / Mod 管理</div>
                </div>
                <div class="admin-header-right">
                    <span class="admin-badge">空壳演示 v0.1</span>
                    <button class="admin-header-btn" title="刷新" onclick="location.reload()">🔄</button>
                    <button class="admin-header-btn" title="返回前台" onclick="location.href='../index.html'">🏠</button>
                </div>
            </header>
            <div class="admin-page-padding">

                <div class="admin-toolbar">
                    <input type="text" placeholder="🔍 搜索 Mod..." style="flex:1; min-width:200px;">
                    <select>
                        <option>全部加载器</option>
                        <option>Fabric</option>
                        <option>Forge</option>
                        <option>NeoForge</option>
                    </select>
                    <select>
                        <option>全部状态</option>
                        <option>已发布</option>
                        <option>待审核</option>
                        <option>已下架</option>
                    </select>
                    <button class="admin-btn admin-btn-primary">+ 新增 Mod</button>
                </div>
                <div class="admin-panel">
                    <div class="admin-empty">
                        <div class="empty-icon">🚧</div>
                        <p>Mod 管理为空壳</p>
                        <p class="empty-sub">后续支持：读 jar 元数据、依赖检查、版本兼容、下载统计</p>
                    </div>
                </div>

            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
