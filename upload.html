<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传 - MC Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">⛏️ MC Archive</div>
        <nav>
            <a href="index.html">首页</a>
            <a href="browse.html">浏览</a>
            <a href="upload.html" class="active">上传</a>
            <a href="#">登录</a>
        </nav>
    </header>

    <main class="upload-page">
        <h1>上传存档或 Mod</h1>
        <p class="subtitle">（当前为空壳演示，暂未接入后端）</p>

        <div class="upload-tabs">
            <button class="tab-btn active" onclick="switchTab('world')">🌍 上传存档</button>
            <button class="tab-btn" onclick="switchTab('mod')">🔧 上传 Mod</button>
        </div>

        <!-- 存档上传表单 -->
        <div id="world-tab" class="tab-content active">
            <form class="upload-form" onsubmit="return false;">
                <div class="form-group">
                    <label>选择存档文件 (.zip / .mcworld)</label>
                    <input type="file" accept=".zip,.mcworld" disabled>
                    <small>暂时只能选择文件，上传功能待开发</small>
                </div>
                <div class="form-group">
                    <label>存档名称</label>
                    <input type="text" placeholder="如：我的生存世界 v2" disabled>
                </div>
                <div class="form-group">
                    <label>游戏版本</label>
                    <select disabled>
                        <option>1.20.4</option>
                        <option>1.19.2</option>
                        <option>1.12.2</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea rows="4" placeholder="介绍一下这个存档..." disabled></textarea>
                </div>
                <button type="submit" class="btn" disabled>上传（暂未启用）</button>
            </form>
        </div>

        <!-- Mod 上传表单 -->
        <div id="mod-tab" class="tab-content">
            <form class="upload-form" onsubmit="return false;">
                <div class="form-group">
                    <label>选择 Mod 文件 (.jar)</label>
                    <input type="file" accept=".jar" disabled>
                    <small>暂时只能选择文件，上传功能待开发</small>
                </div>
                <div class="form-group">
                    <label>Mod 名称</label>
                    <input type="text" placeholder="如：JEI 物品管理器" disabled>
                </div>
                <div class="form-group">
                    <label>加载器</label>
                    <select disabled>
                        <option>Fabric</option>
                        <option>Forge</option>
                        <option>NeoForge</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>MC 版本</label>
                    <input type="text" placeholder="如：1.20.1" disabled>
                </div>
                <button type="submit" class="btn" disabled>上传（暂未启用）</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
