<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mod 管理 - MC Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
    <div class="admin-layout">
        <!-- 侧边栏 -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar-logo">
                🛡️ MC Admin
            </div>
            <nav class="admin-nav">
                <a href="index.html" class="admin-nav-item">📊 仪表盘</a>
                <a href="worlds.html" class="admin-nav-item">🌍 存档管理</a>
                <a href="mods.html" class="admin-nav-item active">🔧 Mod 管理</a>
                <a href="users.html" class="admin-nav-item">👥 用户管理</a>
                <a href="reviews.html" class="admin-nav-item">📋 审核队列</a>
                <a href="settings.html" class="admin-nav-item">⚙️ 设置</a>
            </nav>
            <div class="admin-sidebar-footer">
                <span id="adminUser"></span>
                <button class="admin-btn-sm" onclick="logout()">退出</button>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="admin-main">
            <header class="admin-header">
                <h1>Mod 管理</h1>
                <div class="admin-header-actions">
                    <span class="admin-badge">空壳演示 v0.1</span>
                </div>
            </header>
            <div class="admin-page-padding">
                <div class="admin-toolbar">
                    <input type="text" placeholder="🔍 搜索 Mod..." style="flex:1; min-width:200px;">
                    <select>
                        <option>全部加载器</option>
                        <option>Fabric</option>
                        <option>Forge</option>
                        <option>NeoForge</option>
                    </select>
                    <select>
                        <option>全部状态</option>
                        <option>已发布</option>
                        <option>待审核</option>
                        <option>已下架</option>
                    </select>
                    <button class="admin-btn admin-btn-primary" style="width:auto; padding:0.5rem 1.5rem;">+ 新增 Mod</button>
                </div>
                <div class="admin-panel">
                    <div class="admin-empty">
                        <p>🚧 Mod 管理为空壳</p>
                        <p style="font-size:0.85rem; margin-top:0.5rem;">后续支持：读 jar 元数据、依赖检查、版本兼容</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
